name: End-to-end test (real Windows desktop)

on:
  # Actions minutes are limited: run for release tags, or by hand (Actions tab -> Run workflow).
  # Everyday changes are tested locally (pytest, a PyInstaller build and --selftest).
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run end-to-end scenarios
        run: python demo/e2e_windows.py

      - name: Summary
        if: always()
        shell: bash
        run: cat e2e_out/results.md >> $GITHUB_STEP_SUMMARY || true

      - name: Keep the results (screenshots, video, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e_out/
          retention-days: 14

      - name: Fail if any scenario failed
        shell: bash
        run: python -c "import json,sys; r=json.load(open('e2e_out/results.json')); f=[x['name'] for x in r if x['status']!='PASS']; print(len(r)-len(f),'/',len(r),'passed'); sys.exit(1 if f or not r else 0)"
