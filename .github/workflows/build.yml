name: Build Windows app

on:
  # Actions minutes are limited: run for release tags, or by hand (Actions tab -> Run workflow).
  # Everyday changes are tested locally (pytest, a PyInstaller build and --selftest).
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build app folder (for the installer)
        run: pyinstaller ShiftWheel.spec --noconfirm

      - name: Build portable ShiftWheel.exe
        run: pyinstaller ShiftWheel.spec --noconfirm
        env:
          ONEFILE: "1"

      - name: Self-test both builds (FFmpeg, OCR models, OpenCV, printing, every window)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          foreach ($exe in @("dist\ShiftWheel\ShiftWheel.exe", "dist\ShiftWheel.exe")) {
            $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru
            Get-Content "$env:LOCALAPPDATA\ShiftWheel\log.txt" -Tail 25
            if ($p.ExitCode -ne 0) { throw "Self-test failed for $exe ($($p.ExitCode))" }
            "Self-test passed: $exe"
          }
          "{0:N1} MB portable" -f ((Get-Item dist\ShiftWheel.exe).Length / 1MB)

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc installer\ShiftWheel.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          "{0:N1} MB installer" -f ((Get-Item dist\ShiftWheel-Setup.exe).Length / 1MB)

      - name: Test the installer (silent install, run, uninstall)
        shell: pwsh
        run: |
          $p = Start-Process dist\ShiftWheel-Setup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS=contextmenu" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Install failed ($($p.ExitCode))" }
          $app = "$env:LOCALAPPDATA\Programs\ShiftWheel\ShiftWheel.exe"
          if (-not (Test-Path $app)) { throw "App not installed" }
          if (-not (Test-Path "HKCU:\Software\Classes\*\shell\ShiftWheel\command")) { throw "File context menu not registered" }
          if (-not (Test-Path "HKCU:\Software\Classes\Directory\shell\ShiftWheel\command")) { throw "Folder context menu not registered" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $t = Start-Process $app -ArgumentList "--selftest" -Wait -PassThru
          if ($t.ExitCode -ne 0) { throw "Installed app self-test failed" }
          Remove-Item Env:QT_QPA_PLATFORM
          $u = Start-Process "$env:LOCALAPPDATA\Programs\ShiftWheel\unins000.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES" -Wait -PassThru
          Start-Sleep 3
          if (Test-Path "HKCU:\Software\Classes\*\shell\ShiftWheel") { throw "Uninstall left the context menu behind" }
          if (Test-Path "HKCU:\Software\Classes\Directory\shell\ShiftWheel") { throw "Uninstall left the folder menu behind" }
          "Installer OK"

      - uses: actions/upload-artifact@v4
        with:
          name: ShiftWheel-windows
          path: |
            dist/ShiftWheel.exe
            dist/ShiftWheel-Setup.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "ShiftWheel ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md || true
          # FFmpeg is GPL: its source goes with every release (version from the bundled build)
          curl -fsSL "https://ffmpeg.org/releases/ffmpeg-7.1.tar.xz" -o dist/ffmpeg-7.1-source.tar.xz
          gh release upload "${GITHUB_REF_NAME}" dist/ShiftWheel-Setup.exe dist/ShiftWheel.exe install-mac.sh \
            dist/ffmpeg-7.1-source.tar.xz --clobber
