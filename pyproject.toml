[project]
name = "shiftwheel"
description = "Drag a file, tap a key, drop it on the wheel: convert, edit, print or share it."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Aditya Prakash" }]
dynamic = ["version", "dependencies"]

[project.urls]
Downloads = "https://github.com/Aditya-Prakash-047/ShiftWheel-releases/releases/latest"
Issues = "https://github.com/Aditya-Prakash-047/ShiftWheel-releases/issues"

[project.gui-scripts]
shiftwheel = "shiftwheel.app:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["shiftwheel"]

[tool.setuptools.dynamic]
version = { attr = "shiftwheel.__version__" }
dependencies = { file = "requirements.txt" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F"]
